    <style>
        @import url('https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Prompt', sans-serif; background-color: transparent; color: #0f172a; -webkit-tap-highlight-color: transparent; }

        /* ===================== พื้นหลังแสงฟ้า-ขาว-น้ำเงิน (Aurora Background) =====================
           ใช้ transform + opacity ล้วนๆ (ไม่แตะ layout/width/height ระหว่างแอนิเมชัน) เพื่อให้เบราว์เซอร์
           วาดผ่าน GPU compositor thread ได้ ทำให้เฟรมแอนิเมชันลื่นเต็มอัตรารีเฟรชของจอ (ปกติคือ 60Hz)
           โดยไม่กระตุกแม้เปิดพร้อมกับแอนิเมชันอื่นบนหน้าเว็บ */
        .aurora-bg {
            position: fixed; inset: 0; z-index: -20; overflow: hidden;
            background: linear-gradient(160deg, #eff6ff 0%, #ffffff 45%, #e0f2fe 100%);
        }
        .aurora-blob {
            position: absolute; border-radius: 9999px; filter: blur(70px);
            will-change: transform, opacity; mix-blend-mode: multiply;
        }
        .blob-sky   { width: 55vw; height: 55vw; top: -15%; left: -12%; background: #38bdf8; opacity: 0.45; animation: floatSky 16s ease-in-out infinite alternate; }
        .blob-blue  { width: 48vw; height: 48vw; bottom: -18%; right: -10%; background: #0284c7; opacity: 0.35; animation: floatBlue 20s ease-in-out infinite alternate; }
        .blob-navy  { width: 40vw; height: 40vw; top: 30%; right: 15%; background: #1d4ed8; opacity: 0.25; animation: floatNavy 24s ease-in-out infinite alternate; }
        .blob-white { width: 35vw; height: 35vw; top: 10%; left: 35%; background: #ffffff; opacity: 0.55; mix-blend-mode: screen; animation: floatWhite 12s ease-in-out infinite alternate; }

        @keyframes floatSky   { 0% { transform: translate(0, 0) scale(1); }   100% { transform: translate(12vw, 10vh) scale(1.15); } }
        @keyframes floatBlue  { 0% { transform: translate(0, 0) scale(1); }   100% { transform: translate(-10vw, -8vh) scale(1.1); } }
        @keyframes floatNavy  { 0% { transform: translate(0, 0) scale(0.9); } 100% { transform: translate(-8vw, 12vh) scale(1.05); } }
        @keyframes floatWhite { 0% { transform: translate(0, 0) scale(1); }   100% { transform: translate(6vw, -6vh) scale(1.2); } }

        /* แสงวิ่งพาดผ่านจอเบาๆ ให้ความรู้สึก "กำลังส่องแสง" อยู่ตลอดเวลา */
        .aurora-sheen {
            position: absolute; inset: -50% -50%; opacity: 0.5;
            background: linear-gradient(115deg, transparent 40%, rgba(255,255,255,0.9) 50%, transparent 60%);
            animation: sheenMove 6s linear infinite;
        }
        @keyframes sheenMove { 0% { transform: translateX(-30%); } 100% { transform: translateX(30%); } }

        @media (prefers-reduced-motion: reduce) {
            .aurora-blob, .aurora-sheen { animation: none !important; }
        }

        /* ===================== การ์ดสินค้า: เอฟเฟกต์เลเซอร์ =====================
           เดิมกรอบเลเซอร์จะโชว์เฉพาะตอน hover เท่านั้น (ใช้งานบนมือถือแทบไม่เห็นเอฟเฟกต์เลย เพราะไม่มี hover)
           ปรับให้มีแสงเรืองแบบเบาๆ วิ่งวนอยู่ตลอดเวลา แล้วสว่างเต็มที่เมื่อแตะ/ชี้เมาส์ */
        .laser-card {
            position: relative; overflow: hidden; border-radius: 1rem; background: #ffffff; z-index: 0;
            transition: box-shadow 0.4s ease, transform 0.25s ease;
            box-shadow: 0 4px 20px -8px rgba(2, 132, 199, 0.25);
        }
        .laser-card::before {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: conic-gradient(from 0deg, transparent 0%, #38bdf8 8%, #ffffff 16%, #1d4ed8 24%, transparent 34%);
            animation: rotate 5s linear infinite; opacity: 0.55; transition: opacity 0.3s; z-index: -2;
        }
        .laser-card:hover { transform: translateY(-3px); box-shadow: 0 12px 30px -10px rgba(2, 132, 199, 0.45); }
        .laser-card:hover::before { opacity: 1; }
        .laser-card::after {
            content: ''; position: absolute; inset: 2px; background: #ffffff; border-radius: 0.9rem; z-index: -1;
        }
        @keyframes rotate { 100% { transform: rotate(360deg); } }

        /* ===================== แถบหมวดหมู่ ===================== */
        .category-pill {
            white-space: nowrap; transition: all 0.2s ease; border: 1px solid #e2e8f0;
        }
        .category-pill.active {
            background: #0284c7; color: #ffffff; border-color: #0284c7;
            box-shadow: 0 4px 14px -4px rgba(2, 132, 199, 0.5);
        }

        /* ===================== การ์ดหมวดหมู่ (แบนเนอร์ + ปุ่มสินค้าทั้งหมด) ===================== */
        .cat-card {
            position: relative; overflow: hidden; border-radius: 1.25rem; background: #ffffff;
            border: 1px solid #eef2f7; box-shadow: 0 4px 20px -10px rgba(2, 132, 199, 0.2);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .cat-card:hover { transform: translateY(-2px); box-shadow: 0 12px 28px -10px rgba(2, 132, 199, 0.35); }
        .cat-banner {
            position: relative; width: 100%; height: 128px; display: flex; align-items: center; justify-content: center;
            overflow: hidden;
        }
        .cat-banner::after {
            content: ''; position: absolute; inset: 0;
            background: radial-gradient(120% 120% at 20% 20%, rgba(255,255,255,0.25), transparent 60%);
        }
        .cat-banner-icon { font-size: 2.75rem; color: rgba(255,255,255,0.95); filter: drop-shadow(0 2px 6px rgba(0,0,0,0.15)); }

        .glass { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .loader { border-top-color: #0284c7; animation: spinner 1s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* BUGFIX: "pb-safe" ไม่ใช่ class จริงของ Tailwind (ไม่มีผลใดๆ) จึงเพิ่ม CSS จริงสำหรับ safe-area ของ iOS */
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); }
    </style>
</head>

    <script>
        // ================= CONFIGURATION =================
        // *** วาง URL ของ Web App จาก Google Apps Script ที่นี่ ***
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzQPJmebLc_UYPFUsVJgJl2H0naxu_FMCR4ykTU4z4waZl6yQ4QdhOUiOFIcJGFVJpm/exec";
        // =================================================

        let globalData = { products: [], settings: {}, orders: [] };
        let cart = [];
        let currentUser = JSON.parse(localStorage.getItem('hma_user') || 'null');

        // BUGFIX: formatMoney ตอนนี้กัน NaN / ค่าว่าง / ค่าที่แปลงเป็นตัวเลขไม่ได้
        const formatMoney = (num) => {
            const n = parseFloat(num);
            return isNaN(n) ? '0' : n.toLocaleString('th-TH');
        };

        // BUGFIX: เพิ่มฟังก์ชัน escapeHtml เพื่อป้องกัน XSS
        // (โค้ดเดิมใส่ค่าจาก backend/ผู้ใช้ เช่น ชื่อสินค้า, อีเมล, ชื่อไฟล์ ลงไปใน innerHTML โดยตรง
        //  ถ้ามีค่าที่มี < > " ' หรือ & ปนอยู่ อาจทำให้ HTML พัง หรือถูกใช้แทรกสคริปต์ได้)
        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        // BUGFIX: helper สำหรับปัดเศษเงินให้เป็น 2 ตำแหน่งเสมอ กันปัญหา floating point (เช่น 19.999999999998)
        function roundMoney(n) {
            return Math.round((parseFloat(n) || 0) * 100) / 100;
        }

        // ===================== ระบบนับจำนวนสต๊อกสินค้า =====================
        // เดิมหน้าเว็บไม่แสดงจำนวนสต๊อก/สถานะสินค้าหมดเลย ทำให้ลูกค้ากดสั่งซื้อสินค้าที่หมดแล้วได้
        // ฟิลด์เก็บรหัส/บัญชี (จากช่อง "ข้อมูลสต๊อก/รหัส ที่จะส่งให้ลูกค้า" ในหน้าแอดมิน) เก็บไว้บรรทัดละ 1 ชุด
        // จึงใช้ "จำนวนบรรทัดที่ไม่ว่าง" เป็นจำนวนสต๊อกคงเหลือของสินค้านั้นๆ โดยอัตโนมัติ ไม่ต้องเพิ่มคอลัมน์ใหม่ใน Sheet
        // BUGFIX: บาง Google Sheet/Apps Script backend อาจส่งชื่อฟิลด์มาไม่ตรงตัวพิมพ์เล็ก-ใหญ่ทุกครั้ง
        // (เช่น Stock, STOCK, stock_data) จึงเช็คหลายชื่อฟิลด์ที่เป็นไปได้กันไว้ ไม่ให้ค่าตกหล่นจนกลายเป็น "สินค้าหมด" ทั้งที่มีจริง
        function getStockCount(p) {
            if (!p) return 0;
            const raw = p.stock ?? p.Stock ?? p.STOCK ?? p.stock_data ?? p.stockData ?? '';
            return String(raw).split(/\r?\n/).map(s => s.trim()).filter(Boolean).length;
        }

        // นับจำนวนสินค้าชิ้นนี้ (ตาม id) ที่ถูกใส่ไว้ในตะกร้าแล้ว เพื่อกันไม่ให้กดเพิ่มเกินจำนวนสต๊อกที่มีจริง
        function cartCountForId(id) {
            return cart.filter(x => x.id === id).length;
        }

        // ===================== จัดกลุ่มสินค้า (ตามชื่อสินค้าโดยตรง ไม่แยกหมวดสตรีมมิ่ง/เพลง/AI ฯลฯ) =====================
        // การ์ดหน้าแรกจะสร้างขึ้นจาก "ชื่อสินค้า" ตรงๆ — สินค้าที่ชื่อเดียวกัน (เช่นต่างระยะเวลา/แพ็กเกจ)
        // จะถูกรวมเป็นการ์ดเดียวกันโดยอัตโนมัติ ไม่ต้องตั้งหมวดหมู่แยกเอง

        // ชุดไล่สีสำรอง ใช้ตอนสินค้ากลุ่มนั้นไม่มีรูปภาพ (เลือกสีตามชื่อสินค้าเพื่อให้สีคงที่ ไม่เปลี่ยนไปมาทุกครั้งที่ render)
        const GROUP_GRADIENTS = [
            'linear-gradient(135deg,#0ea5e9,#1d4ed8)',
            'linear-gradient(135deg,#22c55e,#0f766e)',
            'linear-gradient(135deg,#ef4444,#7f1d1d)',
            'linear-gradient(135deg,#8b5cf6,#4c1d95)',
            'linear-gradient(135deg,#f97316,#be185d)',
            'linear-gradient(135deg,#0284c7,#0f172a)',
            'linear-gradient(135deg,#14b8a6,#1e3a8a)',
            'linear-gradient(135deg,#64748b,#1e293b)'
        ];
        function gradientForName(name) {
            let hash = 0;
            const str = String(name || '');
            for (let i = 0; i < str.length; i++) hash = (hash * 31 + str.charCodeAt(i)) >>> 0;
            return GROUP_GRADIENTS[hash % GROUP_GRADIENTS.length];
        }

        // ทำให้ string ปลอดภัยสำหรับใส่เป็นอาร์กิวเมนต์ในสตริง JS ที่อยู่ภายใน attribute onclick="...('...')"
        function jsAttr(str) {
            const jsEscaped = String(str).replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/\r?\n/g, ' ');
            return escapeHtml(jsEscaped);
        }

        // จัดกลุ่มสินค้าทั้งหมดตามชื่อ (product.name) คืนค่าเป็น object: { ชื่อสินค้า: { count, image, totalStock } }
        function groupProductsByName(products) {
            const groups = {};
            products.forEach(p => {
                const key = (p && p.name ? p.name.trim() : '') || 'ไม่ระบุชื่อสินค้า';
                if (!groups[key]) groups[key] = { count: 0, image: '', totalStock: 0 };
                groups[key].count++;
                groups[key].totalStock += getStockCount(p); // BUGFIX: รวมจำนวนสต๊อกของทุกแพ็กเกจในกลุ่มชื่อเดียวกัน
                if (!groups[key].image && p && p.image) groups[key].image = p.image;
            });
            return groups;
        }

        // ชื่อสินค้ากลุ่มที่กำลังเลือกอยู่บนหน้าแรก ('all' = แสดงการ์ดสินค้าทั้งหมด)
        let currentCategory = 'all';

        function setCategory(key) {
            currentCategory = key;
            // อัปเดตเฉพาะหน้าแรก ไม่ใช้ showView('home') ตรงๆ เพื่อไม่ให้จอเลื่อนกลับขึ้นบนทุกครั้งที่กดการ์ด
            window.scrollTo(0, 0);
            document.getElementById('app-container').innerHTML = renderHome();
        }

        // --- Init Function ---
        window.onload = () => {
            checkBrowser();
            updateUserUI();
            fetchData('init', {}, (res) => {
                // BUGFIX: กันเคส backend ส่งข้อมูลไม่ครบ (products/settings/orders เป็น undefined)
                // ซึ่งเดิมจะทำให้หน้าเว็บพังตอนเรียก .length หรือ .map ทีหลัง
                globalData = {
                    products: (res && res.products) || [],
                    settings: (res && res.settings) || {},
                    orders: (res && res.orders) || []
                };
                document.getElementById('loading').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('loading').style.display = 'none';
                    showView('home');
                    checkPopup();
                }, 300);
            });
        };

        // --- Check Browser & Alert PWA ---
        function checkBrowser() {
            const ua = navigator.userAgent || navigator.vendor || window.opera;
            if (ua.includes("FBAN") || ua.includes("FBAV") || ua.includes("Line")) {
                Swal.fire({
                    icon: 'info',
                    title: 'คำแนะนำการใช้งาน',
                    html: 'เพื่อให้ใช้งานระบบได้สมบูรณ์ กรุณากด <i class="fa-solid fa-ellipsis"></i> มุมขวาบน แล้วเลือก<br><b>"เปิดในเบราว์เซอร์ (Safari / Chrome)"</b>',
                    confirmButtonText: 'รับทราบ',
                    confirmButtonColor: '#0284c7'
                });
            }
        }

        function checkPopup() {
            // BUGFIX: เดิมเข้าถึง globalData.settings.Popup_Message ตรงๆ ถ้า settings เป็น undefined จะ error
            if (!sessionStorage.getItem('popupShown') && globalData.settings && globalData.settings.Popup_Message) {
                Swal.fire({
                    title: globalData.settings.Popup_Message,
                    imageUrl: globalData.settings.Popup_Image || 'https://i.postimg.cc/525qrvD9/IMG-7296.jpg',
                    imageWidth: 200,
                    imageAlt: 'Announcement',
                    confirmButtonText: 'เข้าสู่หน้าเว็บ',
                    confirmButtonColor: '#0284c7'
                });
                sessionStorage.setItem('popupShown', 'true');
            }
        }

        // --- Fetch Wrapper ---
        function fetchData(action, payload, callback) {
            fetch(WEB_APP_URL, {
                method: 'POST',
                body: JSON.stringify({ action: action, payload: payload }),
                headers: { 'Content-Type': 'text/plain' }
            })
            .then(r => r.json())
            .then(res => {
                if (res.status === 'success') callback(res.data);
                else { Swal.fire('เกิดข้อผิดพลาด', res.message, 'error'); hideBtnLoading(); }
            })
            .catch(err => {
                if (WEB_APP_URL === "YOUR_WEB_APP_URL_HERE") {
                    Swal.fire('ตั้งค่าไม่สมบูรณ์', 'กรุณานำ URL จาก Google Apps Script มาใส่ในไฟล์ index.html', 'error');
                } else {
                    Swal.fire('ข้อผิดพลาดการเชื่อมต่อ', err.toString(), 'error');
                }
                hideBtnLoading();
            });
        }

        // --- Views Router ---
        function showView(viewName, data = null) {
            const container = document.getElementById('app-container');
            window.scrollTo(0, 0);
            if (viewName === 'home') { currentCategory = 'all'; container.innerHTML = renderHome(); }
            else if (viewName === 'checkout') container.innerHTML = renderCheckout();
            else if (viewName === 'admin') container.innerHTML = renderAdmin();
            else if (viewName === 'history') container.innerHTML = renderHistory(data);
        }

        // --- Render Home Page ---
        function renderHome() {
            if (!globalData.products || globalData.products.length === 0) {
                return `<div class="text-center py-20 text-slate-400"><i class="fa-solid fa-box-open text-5xl mb-3"></i><br>ยังไม่มีรายการสินค้าในขณะนี้</div>`;
            }

            // จัดกลุ่มสินค้าทั้งหมดตามชื่อสินค้า (คำนวณครั้งเดียวต่อการ render)
            const groups = groupProductsByName(globalData.products);
            const groupNames = Object.keys(groups);

            // ถ้ากลุ่มที่เลือกไว้ก่อนหน้านี้ไม่มีสินค้าอยู่แล้ว (เช่น สินค้าถูกลบไปหมด) ให้กลับไปหน้ารวมสินค้าอัตโนมัติ
            if (currentCategory !== 'all' && !groups[currentCategory]) {
                currentCategory = 'all';
            }

            // ===== โหมดที่ 1: หน้ารวมสินค้า (การ์ดตามชื่อสินค้า + ปุ่ม "สินค้าทั้งหมด") =====
            if (currentCategory === 'all') {
                let html = `<div class="grid grid-cols-1 sm:grid-cols-2 gap-4 pb-12">`;
                groupNames.forEach(name => {
                    const g = groups[name];
                    const bannerStyle = g.image
                        ? `background-image:url('${escapeHtml(g.image)}');background-size:cover;background-position:center;`
                        : `background:${gradientForName(name)}`;
                    html += `
                    <div class="cat-card">
                        <div class="cat-banner" style="${bannerStyle}">
                            ${g.image ? '' : `<i class="fa-solid fa-box cat-banner-icon"></i>`}
                            ${g.totalStock > 0
                                ? `<span class="absolute top-2 right-2 bg-emerald-500/90 backdrop-blur text-white text-[10px] px-2.5 py-1 rounded-full font-medium shadow-sm">คงเหลือ ${g.totalStock} ชิ้น</span>`
                                : `<span class="absolute top-2 right-2 bg-red-500/90 backdrop-blur text-white text-[10px] px-2.5 py-1 rounded-full font-medium shadow-sm">สินค้าหมด</span>`}
                        </div>
                        <div class="p-4">
                            <h3 class="font-bold text-slate-800 text-base leading-snug line-clamp-1">${escapeHtml(name)}</h3>
                            <p class="text-xs text-slate-400 mt-1">มีสินค้าทั้งหมด ${g.count} รายการ · คงเหลือ ${g.totalStock} ชิ้น</p>
                            <button onclick="setCategory('${jsAttr(name)}')" class="mt-3 w-full bg-primary hover:bg-sky-700 text-white py-2.5 rounded-xl text-sm font-medium transition">
                                สินค้าทั้งหมด
                            </button>
                        </div>
                    </div>`;
                });
                html += `</div>`;
                return html;
            }

            // ===== โหมดที่ 2: หน้ารายการสินค้าของชื่อสินค้าที่เลือก =====
            const activeGroup = groups[currentCategory];
            const visibleProducts = globalData.products.filter(p => ((p && p.name ? p.name.trim() : '') || 'ไม่ระบุชื่อสินค้า') === currentCategory);

            let html = `
                <button onclick="setCategory('all')" class="text-slate-400 mb-3 hover:text-slate-700 text-xs flex items-center gap-1">
                    <i class="fa-solid fa-chevron-left"></i> กลับไปหน้ารวมสินค้า
                </button>
                <div class="cat-banner rounded-2xl mb-4" style="${activeGroup && activeGroup.image ? `background-image:url('${escapeHtml(activeGroup.image)}');background-size:cover;background-position:center;` : `background:${gradientForName(currentCategory)}`}">
                    ${activeGroup && activeGroup.image ? '' : `<i class="fa-solid fa-box cat-banner-icon"></i>`}
                </div>
                <h2 class="text-base font-bold mb-4 flex items-center gap-2">
                    ${escapeHtml(currentCategory)}
                    <span class="text-xs font-normal text-slate-400">(${visibleProducts.length} รายการ)</span>
                </h2>`;

            if (visibleProducts.length === 0) {
                return html + `<div class="text-center py-16 text-slate-400"><i class="fa-solid fa-box-open text-4xl mb-3"></i><br>ไม่มีสินค้าในรายการนี้</div>`;
            }

            html += `<div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 pb-12">`;
            visibleProducts.forEach(p => {
                // BUGFIX: escape ค่าทั้งหมดที่มาจาก backend ก่อนแทรกลง innerHTML (กัน XSS / HTML พัง)
                const safeId = escapeHtml(p.id);
                const safeName = escapeHtml(p.name);
                const safeDuration = escapeHtml(p.duration);
                const safeImage = escapeHtml(p.image || 'https://via.placeholder.com/200');

                // BUGFIX: คำนวณจำนวนสต๊อกคงเหลือ แล้วแสดงป้ายสถานะ + ปิดการกดเพิ่มลงตะกร้าเมื่อสินค้าหมด
                const stockCount = getStockCount(p);
                const inStock = stockCount > 0;
                const stockBadge = inStock
                    ? `<span class="absolute top-1.5 right-1.5 bg-emerald-500/90 backdrop-blur text-white text-[9px] px-2 py-0.5 rounded-full font-medium shadow-sm">คงเหลือ ${stockCount} ชิ้น</span>`
                    : `<span class="absolute top-1.5 right-1.5 bg-red-500/90 backdrop-blur text-white text-[9px] px-2 py-0.5 rounded-full font-medium shadow-sm">สินค้าหมด</span>`;

                html += `
                <div class="laser-card p-3 flex flex-col h-full border border-slate-100 shadow-sm ${inStock ? '' : 'opacity-70'}">
                    <div class="w-full h-32 md:h-40 bg-slate-50 rounded-lg overflow-hidden mb-3 relative">
                        <img src="${safeImage}" class="w-full h-full object-cover" alt="${safeName}">
                        ${stockBadge}
                    </div>
                    <h3 class="font-bold text-slate-800 text-sm md:text-base leading-snug line-clamp-1">${safeName}</h3>
                    <p class="text-xs text-slate-400 mt-1"><i class="fa-regular fa-clock mr-1"></i>${safeDuration}</p>
                    <p class="text-xs mt-1 font-semibold ${inStock ? 'text-emerald-600' : 'text-red-500'}">
                        <i class="fa-solid ${inStock ? 'fa-circle-check' : 'fa-circle-xmark'} mr-1"></i>${inStock ? `คงเหลือ ${stockCount} ชิ้น` : 'สินค้าหมด'}
                    </p>
                    <div class="mt-auto pt-3">
                        <div class="flex items-end justify-between mb-3">
                            <span class="text-primary font-bold text-base md:text-lg">${formatMoney(p.price)} ฿</span>
                            <button onclick="showDetails('${safeId}')" class="text-xs text-slate-400 hover:text-slate-600 underline">รายละเอียด</button>
                        </div>
                        ${inStock ? `
                        <button onclick="addToCart('${safeId}')" class="w-full bg-slate-900 hover:bg-black text-white py-2 rounded-lg text-xs md:text-sm font-medium transition flex items-center justify-center gap-1.5">
                            <i class="fa-solid fa-plus text-xs"></i> เพิ่มลงตะกร้า
                        </button>` : `
                        <button disabled class="w-full bg-slate-200 text-slate-400 py-2 rounded-lg text-xs md:text-sm font-medium cursor-not-allowed flex items-center justify-center gap-1.5">
                            <i class="fa-solid fa-ban text-xs"></i> สินค้าหมด
                        </button>`}
                    </div>
                </div>`;
            });
            html += `</div>`;
            return html;
        }

        function showDetails(id) {
            const p = globalData.products.find(x => x.id === id);
            if (!p) return; // BUGFIX: กันเคสหา product ไม่เจอแล้ว p.name จะ error (Cannot read properties of undefined)
            Swal.fire({
                title: escapeHtml(p.name),
                html: `<div class="text-left text-sm text-slate-600 whitespace-pre-line leading-relaxed">${escapeHtml(p.details) || 'ไม่มีรายละเอียดเพิ่มเติม'}</div>`,
                confirmButtonText: 'ปิดหน้าต่าง',
                confirmButtonColor: '#0f172a'
            });
        }

        // --- Cart Management ---
        // BUGFIX: เพิ่มการบังคับเข้าสู่ระบบก่อนทำรายการใดๆ (เพิ่มสินค้าลงตะกร้า/สั่งซื้อ)
        // เดิมผู้ใช้ที่ยังไม่ login สามารถกดเพิ่มสินค้าและไปจนถึงหน้าชำระเงินได้เลย
        function requireUserLogin() {
            if (!currentUser) {
                Swal.fire({
                    title: 'กรุณาเข้าสู่ระบบก่อน',
                    text: 'ต้องเข้าสู่ระบบก่อนจึงจะสามารถทำรายการสั่งซื้อสินค้าได้',
                    icon: 'warning',
                    confirmButtonText: 'เข้าสู่ระบบ',
                    confirmButtonColor: '#0284c7'
                }).then(() => openAuthModal());
                return false;
            }
            return true;
        }

        function addToCart(id) {
            if (!requireUserLogin()) return; // BUGFIX: ต้อง login ก่อนจึงจะเพิ่มสินค้าลงตะกร้าได้
            const p = globalData.products.find(x => x.id === id);
            if (!p) return; // BUGFIX: กันเคสหา product ไม่เจอ

            // BUGFIX: ตรวจสอบจำนวนสต๊อกคงเหลือก่อนเพิ่มลงตะกร้าเสมอ (เผื่อข้อมูลสินค้าเพิ่งรีเฟรชใหม่
            // หรือมีคนอื่นกดสั่งซื้อไปพร้อมกันจนสต๊อกเปลี่ยน) และกันไม่ให้กดเพิ่มสินค้าชิ้นเดียวกัน
            // เกินจำนวนสต๊อกที่มีจริงเข้าไปในตะกร้า
            const stockCount = getStockCount(p);
            if (stockCount <= 0) {
                return Swal.fire('สินค้าหมด', 'ขออภัย สินค้านี้หมดสต๊อกแล้ว', 'warning');
            }
            if (cartCountForId(id) >= stockCount) {
                return Swal.fire('สต๊อกไม่พอ', `มีสินค้านี้คงเหลือเพียง ${stockCount} ชิ้น และอยู่ในตะกร้าครบจำนวนแล้ว`, 'warning');
            }

            // BUGFIX: เดิมใช้ Date.now() อย่างเดียวเป็น cartId ถ้ากดเพิ่มสินค้าเร็วมากๆ ภายใน 1ms เดียวกัน
            // จะได้ cartId ซ้ำกัน ทำให้ removeCart ลบสินค้าผิดชิ้น/ลบซ้ำสองชิ้นพร้อมกัน
            const cartId = Date.now() + '-' + Math.random().toString(36).slice(2, 8);
            cart.push({ ...p, cartId });
            updateCartUI();
            Swal.fire({ toast: true, position: 'top-end', icon: 'success', title: 'เพิ่มลงตะกร้าแล้ว', showConfirmButton: false, timer: 1200 });
        }

        function removeCart(cartId) {
            cart = cart.filter(x => x.cartId !== cartId);
            updateCartUI();
        }

        function updateCartUI() {
            const badge = document.getElementById('cart-badge');
            if (cart.length > 0) { badge.innerText = cart.length; badge.classList.remove('hidden'); }
            else { badge.classList.add('hidden'); }

            const list = document.getElementById('cart-items');
            if (cart.length === 0) {
                list.innerHTML = `<div class="text-center text-slate-400 py-12"><i class="fa-solid fa-basket-shopping text-4xl mb-2"></i><br>ไม่มีสินค้าในตะกร้า</div>`;
            } else {
                let html = ''; let total = 0;
                cart.forEach(item => {
                    total += parseFloat(item.price) || 0;
                    const safeName = escapeHtml(item.name);
                    const safeImage = escapeHtml(item.image);
                    html += `
                    <div class="flex items-center gap-3 bg-slate-50 p-2.5 rounded-xl border border-slate-100">
                        <img src="${safeImage}" class="w-12 h-12 rounded-lg object-cover">
                        <div class="flex-1 min-w-0">
                            <h4 class="text-xs font-bold text-slate-800 truncate">${safeName}</h4>
                            <p class="text-xs text-primary font-semibold mt-0.5">${formatMoney(item.price)} ฿</p>
                        </div>
                        <button onclick="removeCart('${item.cartId}')" class="text-slate-300 hover:text-red-500 p-2"><i class="fa-solid fa-trash-can"></i></button>
                    </div>`;
                });
                list.innerHTML = html;
                document.getElementById('cart-total').innerText = `${formatMoney(roundMoney(total))} ฿`;
            }
        }

        function toggleCart() {
            const modal = document.getElementById('cart-modal');
            const drawer = document.getElementById('cart-drawer');
            if (modal.classList.contains('hidden')) {
                modal.classList.remove('hidden');
                setTimeout(() => drawer.classList.remove('translate-x-full'), 10);
            } else {
                drawer.classList.add('translate-x-full');
                setTimeout(() => modal.classList.add('hidden'), 300);
            }
        }

        function goToCheckout() {
            if (!requireUserLogin()) return; // BUGFIX: ต้อง login ก่อนจึงจะไปหน้าชำระเงินได้
            if (cart.length === 0) return Swal.fire('ตะกร้าว่างเปล่า', 'กรุณาเลือกสินค้าอย่างน้อย 1 ชิ้น', 'warning');
            toggleCart(); showView('checkout');
        }

        // --- Checkout Page ---
        function renderCheckout() {
            let total = roundMoney(cart.reduce((sum, item) => sum + (parseFloat(item.price) || 0), 0));
            let userEmail = currentUser ? currentUser.email : '';
            return `
            <div class="max-w-md mx-auto bg-white p-6 rounded-2xl shadow-sm border border-slate-100 mb-12">
                <button onclick="showView('home')" class="text-slate-400 mb-4 hover:text-slate-700 text-xs flex items-center gap-1"><i class="fa-solid fa-chevron-left"></i> ย้อนกลับ</button>
                <h2 class="text-lg font-bold mb-4 border-b pb-2">ชำระเงินค่าสินค้า</h2>

                <div class="bg-slate-50 p-4 rounded-xl mb-4 text-center border">
                    <img src="https://i.postimg.cc/DwQdNsRv/IMG-7295.jpg" class="w-44 mx-auto rounded-lg shadow-sm mb-3">
                    <p class="text-xs font-semibold text-slate-600">ธนาคารกสิกรไทย (K-Bank)</p>
                    <p class="text-lg font-bold text-primary tracking-wider my-1">180-1-51296-4</p>
                    <p class="text-xs text-slate-500">ชื่อบัญชี: น.ส. วิลาสินี สุร*****</p>
                </div>

                <div class="flex justify-between items-center mb-6 p-3 bg-sky-50 text-sky-900 rounded-xl font-bold text-sm">
                    <span>ยอดชำระเงินสุทธิ:</span>
                    <span class="text-lg text-primary">${formatMoney(total)} บาท</span>
                </div>

                <div class="mb-4 p-3 bg-emerald-50 text-emerald-800 rounded-xl text-xs flex items-start gap-2">
                    <i class="fa-solid fa-circle-check mt-0.5"></i>
                    <span>ระบบจะส่งมอบสินค้าให้ทันทีบนหน้านี้หลังยืนยันการชำระเงิน และดูย้อนหลังได้ที่เมนู "ประวัติสั่งซื้อ" ตลอดเวลา ไม่ต้องรอรับทางอีเมล</span>
                </div>

                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">อีเมลสำหรับผูกบัญชี/ติดต่อ <span class="text-red-500">*</span></label>
                        <input type="email" id="chk-email" value="${escapeHtml(userEmail)}" class="w-full border rounded-xl p-3 text-sm outline-none focus:border-primary" placeholder="example@email.com">
                    </div>

                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">แนบหลักฐานการโอน (สลิป) <span class="text-red-500">*</span></label>
                        <div class="border-2 border-dashed border-slate-200 rounded-xl p-5 text-center hover:bg-slate-50 transition cursor-pointer" onclick="document.getElementById('slip-upload').click()">
                            <i class="fa-solid fa-cloud-arrow-up text-2xl text-slate-400 mb-1"></i>
                            <p class="text-xs text-slate-500" id="slip-name">กดเพื่อเลือกรูปภาพ หรือลากสลิปมาวาง</p>
                            <input type="file" id="slip-upload" accept="image/*" class="hidden" onchange="handleFile(this)">
                        </div>
                        <img id="slip-preview" class="hidden mt-3 rounded-xl w-full max-h-56 object-contain bg-slate-50 border">
                    </div>

                    <button id="btn-confirm" onclick="submitCheckout()" class="w-full bg-slate-900 hover:bg-black text-white font-bold py-3.5 rounded-xl transition flex justify-center items-center gap-2 shadow-md">
                        <i class="fa-solid fa-check-circle"></i> ยืนยันการชำระเงิน
                    </button>
                </div>
            </div>`;
        }

        let slipBase64Str = "";
        function handleFile(input) {
            const file = input.files[0];
            if (!file) return;

            // BUGFIX: กันเคสไฟล์ไม่ใช่รูปภาพ (บาง browser ให้เลือกไฟล์อื่นได้แม้ accept="image/*")
            if (!file.type.startsWith('image/')) {
                Swal.fire('ไฟล์ไม่ถูกต้อง', 'กรุณาเลือกไฟล์รูปภาพเท่านั้น', 'warning');
                input.value = '';
                return;
            }

            document.getElementById('slip-name').innerText = file.name;
            const reader = new FileReader();
            reader.onload = function (e) {
                const img = new Image();
                img.onload = function () {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 800;
                    // BUGFIX: โค้ดเดิมคำนวณ scaleSize = MAX_WIDTH / img.width เสมอ
                    // ถ้ารูปเล็กกว่า 800px อยู่แล้ว จะกลายเป็นการ "ขยาย" ภาพให้ใหญ่ขึ้น (scaleSize > 1)
                    // ทำให้ภาพแตก/เบลอโดยไม่จำเป็น จึงย่อเฉพาะเมื่อรูปใหญ่กว่า MAX_WIDTH เท่านั้น
                    let targetWidth = img.width;
                    let targetHeight = img.height;
                    if (img.width > MAX_WIDTH) {
                        const scaleSize = MAX_WIDTH / img.width;
                        targetWidth = MAX_WIDTH;
                        targetHeight = img.height * scaleSize;
                    }
                    canvas.width = targetWidth;
                    canvas.height = targetHeight;
                    const ctx = canvas.getContext("2d");
                    ctx.drawImage(img, 0, 0, targetWidth, targetHeight);
                    slipBase64Str = canvas.toDataURL("image/jpeg", 0.7);

                    const preview = document.getElementById('slip-preview');
                    preview.src = slipBase64Str; preview.classList.remove('hidden');
                }
                img.src = e.target.result;
            }
            reader.readAsDataURL(file);
        }

        function submitCheckout() {
            if (!requireUserLogin()) return; // BUGFIX: กันชั้นสุดท้าย เผื่อมีคนเข้าหน้าชำระเงินมาโดยไม่ผ่าน goToCheckout
            const email = document.getElementById('chk-email').value.trim();
            // BUGFIX: เดิมเช็คแค่ email.includes('@') ซึ่งผ่านได้แม้กรอกแค่ "a@" หรือ "@@@"
            // เปลี่ยนเป็น regex ตรวจรูปแบบอีเมลที่สมเหตุสมผลกว่า
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!email || !emailRegex.test(email)) return Swal.fire('ข้อมูลไม่ครบถ้วน', 'กรุณากรอกอีเมลให้ถูกต้อง', 'warning');
            if (!slipBase64Str) return Swal.fire('ข้อมูลไม่ครบถ้วน', 'กรุณาแนบสลิปการโอนเงิน', 'warning');
            if (cart.length === 0) return Swal.fire('ตะกร้าว่างเปล่า', 'ไม่มีสินค้าในตะกร้า กรุณาเลือกสินค้าใหม่อีกครั้ง', 'warning'); // BUGFIX: กันกดยืนยันซ้ำหลังตะกร้าถูกล้างไปแล้ว

            const total = roundMoney(cart.reduce((sum, item) => sum + (parseFloat(item.price) || 0), 0));
            const btn = document.getElementById('btn-confirm');
            btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> กำลังส่งข้อมูล...';

            const payload = { email: email, items: cart, total: total, slipBase64: slipBase64Str };

            fetchData('checkout', payload, (res) => {
                showReceipt(res);
                cart = []; updateCartUI(); slipBase64Str = "";
            });
        }

        // --- Receipt Display & Download ---
        // BUGFIX: สินค้าจะแสดง "บนเว็บ" ทันทีในหน้านี้ (ไม่ใช่ส่งไปทางอีเมลแล้วให้ลูกค้ารอเปิดอีเมล)
        // และยังดูย้อนหลังได้อีกครั้งจากเมนู "ประวัติสั่งซื้อ" (ดู renderHistory ด้านล่าง)
        function showReceipt(orderData) {
            const deliveryItems = (orderData && orderData.deliveryItems) || []; // BUGFIX: กัน deliveryItems undefined
            let itemsHtml = deliveryItems.map((txt, idx) => `
                <div class="flex items-center gap-2 bg-slate-50 border p-2.5 rounded-lg mb-2">
                    <div class="flex-1 min-w-0 text-xs font-mono text-slate-700 break-all">${escapeHtml(txt)}</div>
                    <button onclick="copyDeliveryText(${idx})" class="text-slate-400 hover:text-primary shrink-0 p-1" title="คัดลอก"><i class="fa-regular fa-copy"></i></button>
                </div>`).join('');

            // เก็บข้อความไว้ในตัวแปรกลาง เพื่อให้ปุ่มคัดลอกเรียกใช้ได้โดยไม่ต้องยุ่งกับการ escape ใน onclick
            window.__deliveryItemsForCopy = deliveryItems;

            const html = `
            <div id="receipt-box" class="p-6 bg-white max-w-sm mx-auto rounded-xl border text-left" style="font-family: 'Prompt', sans-serif;">
                <div class="text-center mb-4">
                    <img src="https://i.postimg.cc/525qrvD9/IMG-7296.jpg" class="w-14 h-14 mx-auto rounded-full mb-2">
                    <h2 class="font-bold text-base">ใบเสร็จรับเงิน</h2>
                    <p class="text-[10px] text-slate-400">หมามอยด์ Premium</p>
                    <p class="text-[10px] text-slate-400 mt-1">Order ID: ${escapeHtml(orderData && orderData.orderId)}</p>
                </div>
                <hr class="border-dashed my-3">
                <div class="mb-3">
                    <h3 class="font-bold text-xs text-primary mb-2"><i class="fa-solid fa-box"></i> ข้อมูลสินค้าที่ได้รับ (ส่งมอบบนเว็บทันที):</h3>
                    ${itemsHtml || `<p class="text-xs text-slate-400">ไม่มีข้อมูลสินค้าที่ต้องแสดง</p>`}
                </div>
                <hr class="border-dashed my-3">
                <p class="text-center text-xs text-slate-400">ชำระเงินเรียบร้อยแล้ว ดูข้อมูลนี้ซ้ำได้ที่เมนู "ประวัติสั่งซื้อ" ขอบคุณที่ใช้อุดหนุนค่ะ</p>
            </div>
            <button onclick="downloadReceipt()" class="mt-4 w-full bg-primary text-white py-2.5 rounded-xl font-medium text-xs shadow-sm"><i class="fa-solid fa-download mr-1"></i> บันทึกใบเสร็จ (.png)</button>
            <button onclick="Swal.close(); showView('home')" class="mt-2 w-full bg-slate-100 text-slate-700 py-2.5 rounded-xl font-medium text-xs">กลับสู่หน้าแรก</button>
            `;

            Swal.fire({ html: html, showConfirmButton: false, allowOutsideClick: false, width: '380px' });
        }

        // BUGFIX: ฟังก์ชันคัดลอกข้อมูลสินค้า (เช่น รหัส/บัญชี) แต่ละบรรทัดไปยัง clipboard
        // เพื่อให้ลูกค้าเอาไปวางใช้งานต่อได้ทันทีจากหน้าเว็บ โดยไม่ต้องเปิดอีเมล
        function copyDeliveryText(idx) {
            const items = window.__deliveryItemsForCopy || [];
            const text = items[idx];
            if (text === undefined) return;
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => {
                    Swal.fire({ toast: true, position: 'top-end', icon: 'success', title: 'คัดลอกแล้ว', showConfirmButton: false, timer: 1000 });
                }).catch(() => {
                    Swal.fire('คัดลอกไม่สำเร็จ', 'กรุณาคัดลอกด้วยตนเอง', 'warning');
                });
            }
        }

        function downloadReceipt() {
            const elm = document.getElementById('receipt-box');
            if (!elm) return; // BUGFIX: กัน error ถ้า element ยังไม่ถูก render ในโดม
            html2canvas(elm, { scale: 2 }).then(canvas => {
                const link = document.createElement('a');
                link.download = `receipt-${Date.now()}.png`;
                link.href = canvas.toDataURL(); link.click();
            });
        }

        function hideBtnLoading() {
            const btn = document.getElementById('btn-confirm');
            if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-check-circle"></i> ยืนยันการชำระเงิน'; }
        }

        // --- User Auth System ---
        function updateUserUI() {
            const btnText = document.getElementById('user-btn-text');
            if (currentUser) btnText.innerText = currentUser.name;
            else btnText.innerText = 'เข้าสู่ระบบ';
        }

        function openAuthModal() {
            if (currentUser) {
                Swal.fire({
                    title: escapeHtml(currentUser.name),
                    text: currentUser.email,
                    icon: 'info',
                    showCancelButton: true,
                    confirmButtonText: 'ออกจากระบบ',
                    cancelButtonText: 'ปิด',
                    confirmButtonColor: '#ef4444'
                }).then(res => {
                    if (res.isConfirmed) {
                        localStorage.removeItem('hma_user');
                        currentUser = null;
                        updateUserUI();
                        Swal.fire('สำเร็จ', 'ออกจากระบบเรียบร้อย', 'success');
                    }
                });
            } else {
                showLoginModal();
            }
        }

        function showLoginModal() {
            Swal.fire({
                title: 'เข้าสู่ระบบ',
                html: `
                    <input id="auth-email" type="email" class="swal2-input" placeholder="อีเมล">
                    <input id="auth-pass" type="password" class="swal2-input" placeholder="รหัสผ่าน">
                    <div class="mt-3 text-xs text-slate-500">ยังไม่มีบัญชี? <a href="#" onclick="showRegisterModal()" class="text-primary underline">สมัครสมาชิก</a></div>
                `,
                showCancelButton: true, confirmButtonText: 'เข้าสู่ระบบ', confirmButtonColor: '#0284c7',
                preConfirm: () => {
                    const email = document.getElementById('auth-email').value.trim();
                    const password = document.getElementById('auth-pass').value;
                    // BUGFIX: เดิมไม่มีการตรวจสอบก่อนส่ง ทำให้กดยืนยันทั้งที่ยังไม่กรอกอะไรได้
                    if (!email || !password) {
                        Swal.showValidationMessage('กรุณากรอกอีเมลและรหัสผ่านให้ครบ');
                        return false;
                    }
                    return { email, password };
                }
            }).then(res => {
                if (res.isConfirmed) {
                    Swal.showLoading();
                    fetchData('login', res.value, (userData) => {
                        currentUser = userData;
                        localStorage.setItem('hma_user', JSON.stringify(userData));
                        updateUserUI();
                        Swal.fire('สำเร็จ', `ยินดีต้อนรับคุณ ${escapeHtml(userData.name)}`, 'success');
                    });
                }
            });
        }

        function showRegisterModal() {
            Swal.fire({
                title: 'สมัครสมาชิก',
                html: `
                    <input id="reg-name" type="text" class="swal2-input" placeholder="ชื่อผู้ใช้งาน">
                    <input id="reg-email" type="email" class="swal2-input" placeholder="อีเมล">
                    <input id="reg-pass" type="password" class="swal2-input" placeholder="ตั้งรหัสผ่าน">
                `,
                showCancelButton: true, confirmButtonText: 'ยืนยันสมัคร', confirmButtonColor: '#0284c7',
                preConfirm: () => {
                    const name = document.getElementById('reg-name').value.trim();
                    const email = document.getElementById('reg-email').value.trim();
                    const password = document.getElementById('reg-pass').value;
                    // BUGFIX: เพิ่มการตรวจสอบข้อมูลก่อนส่งสมัครสมาชิก
                    if (!name || !email || !password) {
                        Swal.showValidationMessage('กรุณากรอกข้อมูลให้ครบทุกช่อง');
                        return false;
                    }
                    return { name, email, password };
                }
            }).then(res => {
                if (res.isConfirmed) {
                    Swal.showLoading();
                    fetchData('register', res.value, (userData) => {
                        currentUser = userData;
                        localStorage.setItem('hma_user', JSON.stringify(userData));
                        updateUserUI();
                        Swal.fire('สำเร็จ', 'สมัครสมาชิกเรียบร้อยแล้ว', 'success');
                    });
                }
            });
        }

        // --- Purchase History ---
        function showHistoryView() {
            if (!currentUser) {
                return Swal.fire({
                    title: 'กรุณาเข้าสู่ระบบ',
                    text: 'ต้องเข้าสู่ระบบก่อนจึงจะดูประวัติการสั่งซื้อได้',
                    icon: 'warning',
                    confirmButtonText: 'เข้าสู่ระบบ',
                    confirmButtonColor: '#0284c7'
                }).then(() => openAuthModal());
            }

            Swal.showLoading();
            fetchData('getUserOrders', { email: currentUser.email }, (orders) => {
                Swal.close();
                showView('history', orders);
            });
        }

        // BUGFIX: เก็บออเดอร์ล่าสุดที่โหลดมาไว้ในตัวแปรกลาง เพื่อให้ปุ่ม "ดูข้อมูลสินค้า"
        // ในประวัติสั่งซื้อเรียกดูรหัส/บัญชีที่ได้รับซ้ำได้จากหน้าเว็บโดยตรง ไม่ต้องพึ่งอีเมล
        let historyOrders = [];

        function renderHistory(orders) {
            historyOrders = orders || [];
            if (!orders || orders.length === 0) {
                return `<div class="max-w-md mx-auto text-center py-20 text-slate-400"><i class="fa-solid fa-clock-rotate-left text-5xl mb-3"></i><br>ยังไม่มีประวัติการสั่งซื้อ</div>`;
            }
            let listHtml = orders.map((o, idx) => {
                const items = o.items || []; // BUGFIX: กัน o.items undefined ทำให้ .map error
                let itemsStr = items.map(i => `<span class="inline-block bg-slate-100 text-slate-700 px-2 py-0.5 rounded text-[11px] mr-1 mb-1">${escapeHtml(i.name)}</span>`).join('');
                return `
                <div class="bg-white p-4 rounded-xl border mb-3 shadow-sm">
                    <div class="flex justify-between items-center mb-2">
                        <span class="font-bold text-xs text-primary">${escapeHtml(o.orderId)}</span>
                        <span class="text-[10px] text-slate-400">${new Date(o.date).toLocaleDateString('th-TH')}</span>
                    </div>
                    <div class="mb-2">${itemsStr}</div>
                    <div class="flex justify-between items-center text-xs font-bold pt-2 border-t mb-2">
                        <span>ยอดรวม</span>
                        <span class="text-slate-800">${formatMoney(o.total)} ฿</span>
                    </div>
                    <button onclick="viewHistoryDelivery(${idx})" class="w-full bg-slate-900 hover:bg-black text-white py-2 rounded-lg text-xs font-medium transition flex items-center justify-center gap-1.5">
                        <i class="fa-solid fa-box-open text-xs"></i> ดูข้อมูลสินค้าที่ได้รับ
                    </button>
                </div>`;
            }).join('');

            return `
            <div class="max-w-md mx-auto mb-16">
                <h2 class="text-base font-bold mb-4 flex items-center gap-2"><i class="fa-solid fa-receipt text-primary"></i> ประวัติการสั่งซื้อของคุณ</h2>
                ${listHtml}
            </div>`;
        }

        // BUGFIX: เปิดดูข้อมูลสินค้า (รหัส/บัญชี) ของออเดอร์เก่าซ้ำได้จากหน้าประวัติสั่งซื้อ
        // โดยใช้ modal เดียวกับตอนซื้อสำเร็จ (showReceipt) — ทำให้ลูกค้ากลับมาดูสินค้าที่เคยได้รับ
        // ได้ตลอดเวลาจากหน้าเว็บ ไม่ต้องค้นหาในอีเมลเก่า
        function viewHistoryDelivery(idx) {
            const order = historyOrders[idx];
            if (!order) return;
            showReceipt(order);
        }

        // --- Contact Admin Modal ---
        function showContactModal() {

                html: `
                    <div class="space-y-3 pt-2">

                    </div>

        // --- Admin Dashboard ---
        // BUGFIX (ความปลอดภัย): เดิม PIN ถูกเช็คฝั่ง client ตรงๆ (result.value === "1272304")
        // ใครก็ตามที่เปิดดูซอร์สโค้ดในเบราว์เซอร์จะเห็น PIN และเรียก action adminSaveProduct/
        // adminDeleteProduct/adminSaveSettings ข้ามหน้า Swal นี้ไปตรงๆ ได้เลยโดยไม่ต้องรู้ PIN
        // เปลี่ยนให้ยืนยัน PIN ผ่าน backend (action 'adminLogin') แทน และเก็บ PIN ไว้ในตัวแปรนี้
        // เฉพาะระหว่างที่หน้าเว็บยังเปิดอยู่ (ไม่บันทึกลง localStorage) เพื่อแนบไปกับทุกคำสั่งเขียนของแอดมิน
        // ฝั่ง Google Apps Script จะเป็นผู้ตัดสินใจจริงว่า PIN ถูกหรือไม่
        let adminPin = null;

        function checkAdmin() {
            Swal.fire({
                title: 'เข้าสู่ระบบแอดมิน',
                input: 'password',
                inputPlaceholder: 'กรอกรหัส PIN',
                showCancelButton: true,
                confirmButtonText: 'ยืนยัน',
                confirmButtonColor: '#0f172a'
            }).then((result) => {
                if (result.isConfirmed) {
                    const pin = (result.value || '').trim();
                    if (!pin) return Swal.fire('ผิดพลาด', 'กรุณากรอกรหัส PIN', 'warning');
                    Swal.showLoading();
                    fetchData('adminLogin', { pin: pin }, () => {
                        adminPin = pin;
                        showView('admin');
                    });
                }
            });
        }

        function renderAdmin() {
            const products = globalData.products || []; // BUGFIX: กัน undefined
            const orders = globalData.orders || [];      // BUGFIX: กัน undefined
            const settings = globalData.settings || {};  // BUGFIX: กัน undefined

            let pRows = products.map(p => {
                const stockCount = getStockCount(p); // BUGFIX: แสดงจำนวนสต๊อกคงเหลือในตารางแอดมินด้วย เพื่อให้เติมสต๊อกได้ทันเวลา
                const stockLabel = stockCount > 0
                    ? `<span class="text-emerald-600 font-semibold">${stockCount}</span>`
                    : `<span class="text-red-500 font-semibold">หมด</span>`;
                return `
                <tr class="border-b text-xs">
                    <td class="p-2"><img src="${escapeHtml(p.image)}" class="w-8 h-8 rounded object-cover"></td>
                    <td class="p-2 font-medium">${escapeHtml(p.name)}</td>
                    <td class="p-2">${formatMoney(p.price)}</td>
                    <td class="p-2">${stockLabel}</td>
                    <td class="p-2">
                        <button onclick="editProduct('${escapeHtml(p.id)}')" class="text-sky-600 mr-2"><i class="fa-solid fa-pen"></i></button>
                        <button onclick="deleteProduct('${escapeHtml(p.id)}')" class="text-red-500"><i class="fa-solid fa-trash"></i></button>
                    </td>
                </tr>`;
            }).join('');

            let oRows = orders.map(o => `
                <tr class="border-b text-[11px]">
                    <td class="p-2 font-mono">${escapeHtml(o.orderId)}</td>
                    <td class="p-2">${escapeHtml(o.email)}</td>
                    <td class="p-2">${formatMoney(o.total)}</td>
                    <td class="p-2"><a href="${escapeHtml(o.slip)}" target="_blank" rel="noopener" class="text-sky-600 underline">ดูสลิป</a></td>
                </tr>`).join('');

            return `
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 mb-16">
                <div class="flex justify-between items-center mb-6 border-b pb-3">
                    <h2 class="text-base font-bold"><i class="fa-solid fa-sliders text-primary"></i> แผงควบคุมแอดมิน</h2>
                    <button onclick="showView('home')" class="text-xs text-slate-500 border px-3 py-1 rounded-lg">ปิด</button>
                </div>

                <div class="mb-8">
                    <div class="flex justify-between items-center mb-3">
                        <h3 class="font-bold text-xs text-slate-700">รายการสินค้าในร้าน</h3>
                        <button onclick="editProduct('')" class="bg-primary text-white px-3 py-1 rounded-lg text-xs font-medium"><i class="fa-solid fa-plus mr-1"></i>เพิ่มสินค้า</button>
                    </div>
                    <div class="overflow-x-auto border rounded-xl">
                        <table class="w-full text-left border-collapse">
                            <thead><tr class="bg-slate-50 text-slate-500 text-xs">
                                <th class="p-2">รูป</th><th class="p-2">ชื่อ</th><th class="p-2">ราคา</th><th class="p-2">สต๊อก</th><th class="p-2">จัดการ</th>

                            <tbody>${pRows}</tbody>
                        </table>
                    </div>

                <div class="mb-6">
                    <h3 class="font-bold text-xs text-slate-700 mb-3">ประวัติการสั่งซื้อล่าสุด</h3>

                        <table class="w-full text-left border-collapse">
                            <thead><tr class="bg-slate-50 text-slate-500 text-xs">
                                <th class="p-2">ID</th><th class="p-2">อีเมล</th><th class="p-2">ยอด</th><th class="p-2">สลิป</th>
                            </tr></thead>
                            <tbody>${oRows}</tbody>
                        </table>
                    </div>
                </div>

                <div>
                    <h3 class="font-bold text-xs text-slate-700 mb-3">ตั้งค่า Pop-up ประกาศ</h3>
                    <div class="space-y-2">
                        <input id="set-pop-msg" class="w-full border p-2 rounded-lg text-xs" placeholder="ข้อความประกาศ" value="${escapeHtml(settings.Popup_Message || '')}">
                        <input id="set-pop-img" class="w-full border p-2 rounded-lg text-xs" placeholder="URL รูปภาพ Pop-up" value="${escapeHtml(settings.Popup_Image || '')}">
                        <button onclick="saveAdminSettings()" class="bg-slate-800 text-white px-4 py-2 rounded-lg text-xs">บันทึกการตั้งค่า Pop-up</button>
                    </div>
                </div>
            </div>`;
        }

        // BUGFIX: เปลี่ยนรูปแบบกรอกสต๊อกจาก textarea ก้อนเดียว (พิมพ์รวมกันแล้วนับบรรทัด)
        // เป็น "1 กล่องข้อความ = 1 สต๊อก" แยกทีละช่อง เพิ่มได้ไม่จำกัดจำนวน เพื่อกันการกรอกผิดบรรทัด/เผลอเว้นบรรทัดว่าง
        // จนนับสต๊อกผิดพลาด ส่วนการเก็บข้อมูลจริงยังคงเป็น string คั่นด้วยขึ้นบรรทัดใหม่เหมือนเดิม (ไม่กระทบ backend/getStockCount)
        function renderStockBoxRow(value) {
            return `<div class="flex items-center gap-2 mb-2" data-stock-row>
                <input type="text" class="swal2-input stock-box-input" style="margin:0;flex:1;" placeholder="รหัส/บัญชี 1 ชุด (เช่น email:password)" value="${escapeHtml(value)}">
                <button type="button" onclick="removeStockBoxRow(this)" class="text-red-500 hover:text-red-700 px-2 shrink-0"><i class="fa-solid fa-trash-can"></i></button>
            </div>`;
        }

        function addStockBoxRow() {
            const container = document.getElementById('stock-boxes-list');
            if (!container) return;
            container.insertAdjacentHTML('beforeend', renderStockBoxRow(''));
            container.scrollTop = container.scrollHeight;
        }

        function removeStockBoxRow(btn) {
            const row = btn.closest('[data-stock-row]');
            const container = document.getElementById('stock-boxes-list');
            // ต้องเหลืออย่างน้อย 1 กล่องเสมอ ไม่ให้ลบจนหมด (กันฟอร์มพัง/สับสน)
            if (row && container && container.querySelectorAll('[data-stock-row]').length > 1) {
                row.remove();
            } else if (row) {
                row.querySelector('.stock-box-input').value = '';
            }
        }

        function editProduct(id) {
            let p = id ? globalData.products.find(x => x.id === id) : { id: '', name: '', duration: '', price: '', image: '', details: '', stock: '' };
            if (id && !p) { // BUGFIX: กันเคสหา product ไม่เจอ (เช่นข้อมูลถูกลบไปแล้วแต่ตารางยังไม่รีเฟรช)
                Swal.fire('ไม่พบสินค้า', 'ไม่พบสินค้านี้ในระบบ อาจถูกลบไปแล้ว', 'warning');
                return;
            }
            // BUGFIX: แปลงข้อมูลสต๊อกเดิม (คั่นด้วยขึ้นบรรทัดใหม่) กลับมาเป็นรายการกล่องข้อความทีละชุด
            let existingStock = String(p.stock || '').split(/\r?\n/).map(s => s.trim()).filter(Boolean);
            if (existingStock.length === 0) existingStock = ['']; // เริ่มต้นให้มีอย่างน้อย 1 กล่องเสมอ

            Swal.fire({
                title: id ? 'แก้ไขสินค้า' : 'เพิ่มสินค้าใหม่',
                html: `
                    <input id="p-name" class="swal2-input" placeholder="ชื่อสินค้า" value="${escapeHtml(p.name)}">
                    <input id="p-dur" class="swal2-input" placeholder="ระยะเวลา (เช่น 30 วัน)" value="${escapeHtml(p.duration)}">
                    <input id="p-price" type="number" class="swal2-input" placeholder="ราคา (บาท)" value="${escapeHtml(p.price)}">
                    <input id="p-img" class="swal2-input" placeholder="URL รูปภาพสินค้า" value="${escapeHtml(p.image)}">
                    <textarea id="p-det" class="swal2-textarea" placeholder="รายละเอียดสินค้า">${escapeHtml(p.details)}</textarea>
                    <div class="text-left text-xs font-semibold text-slate-600 mt-3 mb-1">ข้อมูลสต๊อก (1 กล่องข้อความ = 1 สต๊อก เพิ่มได้ไม่จำกัด)</div>
                    <div id="stock-boxes-list" class="text-left" style="max-height:220px;overflow-y:auto;padding-right:4px;">
                        ${existingStock.map(v => renderStockBoxRow(v)).join('')}
                    </div>
                    <button type="button" onclick="addStockBoxRow()" class="swal2-styled" style="background:#0284c7;font-size:12px;padding:6px 16px;margin-top:6px;">
                        <i class="fa-solid fa-plus"></i> เพิ่มสต๊อก
                    </button>
                `,
                showCancelButton: true, confirmButtonText: 'บันทึก', confirmButtonColor: '#0284c7',
                preConfirm: () => {
                    const name = document.getElementById('p-name').value.trim();
                    const price = document.getElementById('p-price').value;
                    // BUGFIX: เพิ่มการตรวจสอบขั้นต่ำก่อนบันทึกสินค้า (ชื่อและราคาต้องมีค่า และราคาต้องเป็นตัวเลข)
                    if (!name) {
                        Swal.showValidationMessage('กรุณากรอกชื่อสินค้า');
                        return false;
                    }
                    if (price === '' || isNaN(parseFloat(price))) {
                        Swal.showValidationMessage('กรุณากรอกราคาเป็นตัวเลข');
                        return false;
                    }
                    // BUGFIX: รวบรวมค่าจากทุกกล่องสต๊อก (ตัดช่องว่าง/กล่องว่างทิ้ง) แล้วต่อกลับเป็น string
                    // คั่นด้วยขึ้นบรรทัดใหม่ เพื่อให้ backend และ getStockCount() ใช้งานได้เหมือนเดิมโดยไม่ต้องแก้โครงสร้างข้อมูล
                    const stockValues = Array.from(document.querySelectorAll('#stock-boxes-list .stock-box-input'))
                        .map(inp => inp.value.trim())
                        .filter(Boolean);
                    return {
                        id: id,
                        name: name,
                        duration: document.getElementById('p-dur').value.trim(),
                        price: price,
                        image: document.getElementById('p-img').value.trim(),
                        details: document.getElementById('p-det').value,
                        stock: stockValues.join('\n'),
                        pin: adminPin // BUGFIX: แนบ PIN ที่ยืนยันไว้แล้วไปกับคำสั่งเขียน เพื่อให้ backend ตรวจสอบสิทธิ์อีกครั้ง
                    }
                }
            }).then((res) => {
                if (res.isConfirmed) {
                    if (!requireAdminSession()) return;
                    Swal.showLoading();
                    // BUGFIX: เดิมใช้ window.location.reload() ซึ่งรีโหลดทั้งหน้าเว็บใหม่หมด
                    // พอหน้าเว็บโหลดใหม่ window.onload จะพา showView('home') เสมอ (ตามโค้ด init)
                    // ทำให้ดูเหมือน "เด้งออกจากหน้าแอดมิน" ทุกครั้งที่บันทึกสินค้าสำเร็จ
                    // และ adminPin ที่เก็บไว้ในหน่วยความจำก็จะหายไปด้วย ต้องกรอก PIN ใหม่ทุกครั้ง
                    // แก้เป็นดึงข้อมูลสินค้าล่าสุดมาอัปเดต แล้ว render หน้าแอดมินซ้ำแทน ไม่รีโหลดทั้งหน้า
                    fetchData('adminSaveProduct', res.value, () => {
                        refreshAdminData(id ? 'บันทึกการแก้ไขสินค้าเรียบร้อย' : 'เพิ่มสินค้าใหม่เรียบร้อย');
                    });
                }
            });
        }

        function deleteProduct(id) {
            Swal.fire({
                title: 'ยืนยันลบสินค้า?', icon: 'warning', showCancelButton: true, confirmButtonColor: '#ef4444', confirmButtonText: 'ลบ'
            }).then((res) => {
                if (res.isConfirmed) {
                    if (!requireAdminSession()) return;
                    Swal.showLoading();
                    // BUGFIX: เช่นเดียวกับ editProduct — ไม่ใช้ window.location.reload() แล้ว
                    fetchData('adminDeleteProduct', { id: id, pin: adminPin }, () => {
                        refreshAdminData('ลบสินค้าเรียบร้อย');
                    });
                }
            });
        }

        // BUGFIX: ฟังก์ชันใหม่ — ดึงข้อมูลล่าสุดจาก backend มาอัปเดต globalData แล้วเรนเดอร์
        // หน้าแอดมินซ้ำในที่เดิม แทนการรีโหลดทั้งหน้าเว็บ (window.location.reload()) ที่ทำให้
        // เด้งกลับหน้าแรกและ PIN ที่ยืนยันไว้หายไปทุกครั้งที่บันทึก/ลบสินค้า
        function refreshAdminData(successMessage) {
            fetchData('init', {}, (res) => {
                globalData = {
                    products: (res && res.products) || [],
                    settings: (res && res.settings) || {},
                    orders: (res && res.orders) || []
                };
                showView('admin');
                if (successMessage) {
                    Swal.fire({ toast: true, position: 'top-end', icon: 'success', title: successMessage, showConfirmButton: false, timer: 1500 });
                }
            });
        }

        function saveAdminSettings() {
            if (!requireAdminSession()) return;
            const msg = document.getElementById('set-pop-msg').value;
            const img = document.getElementById('set-pop-img').value;
            Swal.showLoading();
            fetchData('adminSaveSettings', { Popup_Message: msg, Popup_Image: img, pin: adminPin }, () => {
                Swal.fire('สำเร็จ', 'บันทึกการตั้งค่าเรียบร้อย', 'success');
            });
        }

        // BUGFIX: กันเคสที่ adminPin หาย (เช่น รีเฟรชหน้าเว็บระหว่างอยู่ในแผงแอดมิน ตัวแปรในหน่วยความจำจะถูกล้าง)
        // ถ้าไม่มี adminPin เก็บไว้ ให้พาไปยืนยัน PIN ใหม่ก่อน แทนที่จะปล่อยให้ backend ปฏิเสธแบบไม่มีคำอธิบาย
        function requireAdminSession() {
            if (!adminPin) {
                Swal.fire('หมดเวลาเซสชัน', 'กรุณายืนยันรหัส PIN แอดมินอีกครั้ง', 'warning').then(() => checkAdmin());
                return false;
            }
            return true;
        }
    </script>
</body>
</html>
